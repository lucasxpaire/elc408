- id: '6946385735'
  alias: "Teste Temperatura"
  description: "Gerado automaticamente pelo Compilador Homi"
  triggers:
  - platform: state
    entity_id: sensor.temperatura
    to: 'hot'
  conditions:
  - condition: state
    entity_id: binary_sensor.porta
    state: 'off'
  actions:
  - action: notify.persistent_notification
    data:
      message: "Abra ás Portas!"
  mode: single