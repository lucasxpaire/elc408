- id: '7299927751'
  alias: "Rotina Noturna"
  description: "Gerado automaticamente pelo Compilador Homi"
  triggers:
  - platform: time
    at: '22:30:00'
  conditions:
  - condition: state
    entity_id: light.sala_estar
    state: 'off'
  - condition: state
    entity_id: switch.tv
    state: 'off'
  actions:
  - action: light.turn_on
    target:
      entity_id: light.quarto
  - action: notify.persistent_notification
    data:
      message: "Boa noite!"
  mode: single